<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>.panel { width: 100%; padding: 36px 40px 30px; }
.t { font-size: 42px; font-weight: 700; margin-bottom: 26px; }
.bars { height: 440px; display: flex; align-items: flex-end; gap: 22px; border-bottom: 3px solid rgba(255,255,255,.5); }
.col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 10px; }
.bar { width: 100%; border-radius: 18px 18px 6px 6px; background: rgba(255,255,255,.75); transform-origin: bottom; animation: grow .7s cubic-bezier(.2,1,.3,1) both; }
.bar.last { background: var(--accent); box-shadow: 0 0 40px var(--accent); }
.v { font-size: 34px; font-weight: 900; }
.v.last { color: var(--accent); font-size: 46px; }
.lbl { font-size: 28px; opacity: .85; margin-top: 12px; text-align: center; }
.labels { display: flex; gap: 22px; }
.labels div { flex: 1; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }</style></head><body><script>function fxBuild(FX, s) {
  const vals = (FX.numbers.length ? FX.numbers : [12, 18, 25, 40]).slice(0, 7);
  const max = Math.max(...vals, 1);
  const panel = el("div", "panel glass pop", null, s);
  if (FX.title) el("div", "t", FX.title, panel);
  const bars = el("div", "bars", null, panel);
  const labels = el("div", "labels", null, panel);
  vals.forEach((v, k) => {
    const last = k === vals.length - 1, delay = stagger(k, vals.length, 0.25, 0.45);
    const col = el("div", "col", null, bars);
    const val = el("div", "v fade" + (last ? " last" : ""), fmt(v) + (last && FX.unit ? " " + FX.unit : ""), col);
    val.style.animationDelay = delay + 0.35 + "s";
    const b = el("div", "bar" + (last ? " last" : ""), null, col);
    b.style.height = Math.max(4, (v / max) * 100) * 0.82 + "%";
    b.style.animationDelay = delay + "s";
    el("div", "lbl", FX.items[k] || "", labels);
  });
}</script><script src="_base.js"></script></body></html>
