<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>.plate { padding: 30px 70px 46px; text-align: center; }
.label { font-size: 44px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; opacity: .9; }
.num { font-family: "Montserrat", "Poppins", sans-serif; font-weight: 900; font-size: 250px; line-height: 1; color: var(--accent);
  text-shadow: 0 8px 30px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.unit { font-size: 64px; font-weight: 900; color: #fff; margin-left: 12px; }</style></head><body><script>let from = 0, to = 10, dec = 0, numEl;
function fxBuild(FX, s) {
  const n = FX.numbers;
  if (n.length >= 2) { from = n[0]; to = n[1]; } else if (n.length === 1) { to = n[0]; }
  dec = [from, to].some((v) => v % 1) ? 1 : 0;
  const plate = el("div", "plate glass pop", null, s);
  if (FX.title) el("div", "label", FX.title, plate);
  const row = el("div", "", null, plate);
  numEl = el("span", "num", fmt(from, dec), row);
  if (FX.unit) el("span", "unit", FX.unit, row);
}
function fxTick(t) {
  const ticks = FX.ticks || [];
  if (ticks.length) {  // counting real reps: up by one as each finishes, with a little bump
    const done = ticks.filter((x) => x <= t);
    numEl.textContent = fmt(from + done.length, 0);
    const since = done.length ? t - done[done.length - 1] : 9;
    numEl.style.display = "inline-block";
    numEl.style.transform = `scale(${1 + 0.28 * Math.exp(-since * 9) * (since < 0.6 ? 1 : 0)})`;
    return;
  }
  const p = ease((t - 0.25) / Math.max(0.4, FX.duration * 0.62));
  numEl.textContent = fmt(from + (to - from) * p, dec);
}</script><script src="_base.js"></script></body></html>
