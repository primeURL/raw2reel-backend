<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>.panel { width: 100%; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px; }
.q { font-size: 48px; font-weight: 900; text-align: center; line-height: 1.15; }
.opt { position: relative; height: 96px; border-radius: 26px; background: rgba(255,255,255,.2); overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; font-size: 40px; font-weight: 700; }
.opt i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.35); transform-origin: left; animation: fill 1s cubic-bezier(.3,1,.3,1) both; }
.opt.win i { background: var(--accent); }
.opt span { position: relative; }
.pct { opacity: 0; animation: fxFade .3s both; }
@keyframes fill { from { transform: scaleX(0); } }</style></head><body><script>function fxBuild(FX, s) {
  const panel = el("div", "panel glass pop", null, s);
  el("div", "q", FX.title || "Which one?", panel);
  const opts = (FX.items.length ? FX.items : ["Yes", "No"]).slice(0, 4);
  let pct = FX.numbers.slice(0, opts.length);
  if (pct.length < opts.length) pct = opts.map((_, k) => (k === 0 ? 68 : Math.round(32 / (opts.length - 1))));
  const best = pct.indexOf(Math.max(...pct));
  const voteAt = Math.min(1.2, FX.duration * 0.35);
  opts.forEach((o, k) => {
    const row = el("div", "opt rise" + (k === best ? " win" : ""), null, panel);
    row.style.animationDelay = 0.15 + k * 0.1 + "s";
    const bar = el("i", "", null, row);
    bar.style.width = pct[k] + "%";
    bar.style.animationDelay = voteAt + "s";
    el("span", "", o, row);
    const p = el("span", "pct", Math.round(pct[k]) + "%", row);
    p.style.animationDelay = voteAt + 0.3 + "s";
  });
}</script><script src="_base.js"></script></body></html>
